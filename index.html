<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OLED 烟花模拟器 (高亮版)</title>
    <style>
        /* 基础页面样式 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 隐藏滚动条 */
            background-color: #000; /* 纯黑夜空 */
        }

        /* 游戏画布 */
        #fireworksCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #000;
            touch-action: none;
            cursor: crosshair;
            image-rendering: -webkit-optimize-contrast;
            will-change: transform;
            transform: translateZ(0); /* 强制开启GPU加速 */
        }
        
        /* 隐藏全屏触发区域 */
        #fullscreenTrigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 80px;
            height: 80px;
            background: transparent;
            z-index: 9999;
            cursor: default;
        }
    </style>
</head>
<body>
    <div id="fullscreenTrigger"></div>
    <canvas id="fireworksCanvas"></canvas>

    <script>
        // --- 1. 初始化 ---
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        let canvasWidth, canvasHeight;
        // 移除 stars 数组
        let rockets = [];
        let particles = [];
        let lastLaunchTime = 0;
        let currentEffect = 0;
        let mouse = { x: 0, y: 0, down: false };
        let wind = 0;
        let windTarget = 0;
        let shakeIntensity = 0;

        const getPreset = (i) => {
            const h = rand(0, 360); // 每次调用生成全新的随机主色调
            const configs = [
                { baseHue: h, hueVariance: rand(20, 50), speedMin: rand(4, 6), speedMax: rand(8, 11), friction: 0.95 },
                { baseHue: h, hueVariance: rand(5, 15), speedMin: rand(6, 8), speedMax: rand(11, 14), gravity: rand(0.15, 0.22), trailLength: rand(40, 60), brightnessMin: 80 },
                { baseHue: h, hueVariance: 180, speedMin: rand(3, 5), speedMax: rand(8, 12), count: rand(400, 600), shape: 'heart' },
                { baseHue: h, saturation: rand(50, 70), hueVariance: 40, speedMin: rand(8, 10), speedMax: rand(14, 18), crackleChance: rand(0.2, 0.4), flicker: true },
                { baseHue: h, speedMin: 15, speedMax: 25, friction: 0.8, lifespan: 80, hasTrail: false, count: 250 }, // 快速径向瞬闪
                { baseHue: h, speedMin: 12, speedMax: 18, friction: 0.85, trailLength: 3, count: 400 }, // 密集短促火花
                { baseHue: h, gravity: rand(-0.1, -0.05), lifespan: rand(180, 250) },
                { baseHue: h, flicker: true, fadeMin: 0.001, fadeMax: 0.008, speedMax: rand(10, 15) },
                { baseHue: h, saturation: rand(0, 100), size: rand(4, 7), friction: 0.88, gravity: 0.03, lifespan: rand(200, 300) },
                { baseHue: h, speedMin: rand(15, 20), speedMax: rand(25, 35), friction: rand(0.82, 0.88) },
                { baseHue: h, hueVariance: rand(40, 100), brightnessMin: 85, hasTrail: true },
                { specificColors: [h, (h + 120) % 360, (h + 240) % 360], speedMin: 10, speedMax: 15, friction: 0.9, count: 500, trailLength: 5, shape: 'sphere' }, // 高亮三色瞬爆球
                { baseHue: h, size: rand(0.5, 1.5), count: rand(700, 1000), speedMax: rand(15, 22), friction: 0.85 },
                { baseHue: h, speedMin: 15, speedMax: 22, friction: 0.82, count: 350, hasTrail: false, flicker: true, lifespan: 100 }, // 频闪炸裂
                { baseHue: h, brightnessMax: 90, gravity: rand(0.3, 0.5), friction: 0.98 },
                { baseHue: h, speedMin: rand(20, 25), speedMax: rand(30, 40), fadeMin: 0.06, fadeMax: 0.12 },
                { baseHue: h, size: rand(5, 10), friction: rand(0.88, 0.92), crackleChance: 0.08 },
                { baseHue: h, fountain: true, gravity: rand(0.08, 0.12) },
                { baseHue: h, hueVariance: 80, friction: rand(0.75, 0.85), speedMin: 20, speedMax: 30 },
                { baseHue: h, secondary: true, speedMin: 7, speedMax: 13, count: rand(180, 250) }
            ];
            
            const cfg = configs[i] || configs[0];
            // 默认值填充 (加入全局随机扰动确保不重复)
            const varScale = rand(0.8, 1.3);
            return {
                baseHue: h,
                hueVariance: rand(30, 90),
                saturation: rand(45, 75), // 中等饱和度，使色彩更自然
                brightnessMin: rand(45, 60), // 降低亮度，避免过亮发白
                brightnessMax: rand(65, 80),
                speedMin: 5 * varScale,
                speedMax: 10 * varScale,
                gravity: 0.1 * varScale,
                friction: rand(0.93, 0.97),
                size: rand(2, 4) * varScale,
                lifespan: rand(120, 180),
                vortex: 0,
                zigzag: null,
                fountain: false,
                hasTrail: true,
                trailLength: Math.floor(20 * varScale),
                trailDecay: rand(0.92, 0.96),
                crackleChance: 0,
                count: Math.floor(rand(300, 450)),
                fadeMin: 0.006,
                fadeMax: 0.012,
                accel: 1,
                recursive: false,
                flicker: false,
                crackleParams: { count: rand(3, 7), speed: rand(1, 2), lifespan: rand(15, 25), size: rand(0.5, 1.2) },
                ...cfg
            };
        };

        // 辅助函数
        const rand = (min, max) => Math.random() * (max - min) + min;

        // --- 2. 实体类定义 ---

        // 移除 Star 类

        // 烟花火箭 (发射器)
        class Rocket {
            constructor(tx, ty, effectId) {
                this.effectId = effectId;
                this.x = canvasWidth / 2; // 从底部中间发射
                this.y = canvasHeight;
                this.tx = tx; // 目标x
                this.ty = ty; // 目标y
                
                this.hue = rand(0, 360);
                this.brightness = rand(45, 65);
                
                this.trail = [];
                this.speed = rand(8, 14); // 略微降低速度以增强上升轨迹的观察时间
                
                // 计算角度和速度
                const angle = Math.atan2(ty - this.y, tx - this.x);
                this.vx = Math.cos(angle) * this.speed;
                this.vy = Math.sin(angle) * this.speed;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                
                // 更新轨迹
                this.trail.push({ x: this.x, y: this.y, opacity: 1 });
                if (this.trail.length > 25) this.trail.shift(); // 极大幅度增加火箭尾焰长度
                
                // 轨迹透明度衰减
                this.trail.forEach(t => t.opacity *= 0.96);

                // 到达目标点 (或飞过目标点)
                if (this.y < this.ty) {
                    // 创建爆炸
                    createExplosion(this.tx, this.ty, this.effectId);
                    // 标记为待移除
                    return false; 
                }
                return true;
            }

            draw() {
                ctx.beginPath();
                // 画轨迹
                if (this.trail.length > 0) {
                    const last = this.trail[this.trail.length - 1];
                    ctx.moveTo(last.x, last.y);
                    for(let i = this.trail.length - 2; i >= 0; i--) {
                        ctx.lineTo(this.trail[i].x, this.trail[i].y);
                    }
                    ctx.strokeStyle = `hsla(${this.hue}, 65%, ${this.brightness}%, ${this.trail[0].opacity})`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
                
                // 画火箭头
                ctx.fillStyle = `hsl(${this.hue}, 65%, ${this.brightness}%)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 爆炸粒子
        class Particle {
            constructor(x, y, params) {
                this.x = x;
                this.y = y;
                this.params = params; // 继承爆炸的所有随机参数
                
                // 基于爆炸参数，再次随机化每个粒子
                const angle = rand(0, Math.PI * 2);
                const speed = rand(params.speedMin, params.speedMax);
                
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                this.hue = rand(params.baseHue - params.hueVariance, params.baseHue + params.hueVariance);
                this.brightness = rand(params.brightnessMin, params.brightnessMax);
                this.opacity = 1;
                this.lifespan = params.lifespan;
                this.size = rand(params.size * 0.5, params.size * 1.5); // 每个粒子独立随机大小
                this.trail = [];
            }

            update() {
                this.lifespan--;
                if (this.lifespan <= 0) return false;

                // 动态生成的效果算法
                if (this.params.vortex > 0) {
                    const angle = Math.atan2(this.y - canvasHeight / 2, this.x - canvasWidth / 2);
                    this.vx += Math.cos(angle + Math.PI / 2) * this.params.vortex;
                    this.vy += Math.sin(angle + Math.PI / 2) * this.params.vortex;
                }
                if (this.params.hueDrift > 0) this.hue += this.params.hueDrift;
                if (this.params.zigzag) {
                    this.vx += Math.sin(this.lifespan * this.params.zigzag.f) * this.params.zigzag.a;
                }
                if (this.params.accel !== 1 && this.lifespan < 100) {
                    this.vx *= this.params.accel;
                    this.vy *= this.params.accel;
                }
                if (this.params.recursive && this.lifespan % 40 === 0 && this.opacity > 0.6) {
                    createCrackle(this.x, this.y, { count: 3, speed: 1, lifespan: 15, size: 0.5 });
                }
                if (this.params.fountain) this.vy -= 0.15;
                if (this.params.secondary && !this.spawned && this.lifespan === Math.floor(this.params.lifespan / 2)) {
                    this.spawned = true;
                    createCrackle(this.x, this.y, { count: 12, speed: 3, lifespan: 40, size: 1.5 });
                }

                this.vx *= this.params.friction;
                this.vy *= this.params.friction;
                this.vx += wind; // 引入环境风场影响
                this.vy += this.params.gravity;
                this.x += this.vx;
                this.y += this.vy;

                this.opacity -= rand(this.params.fadeMin, this.params.fadeMax);
                if (this.params.flicker && Math.random() < 0.2) this.opacity = Math.random() > 0.5 ? 0.1 : 1;

                if (this.params.hasTrail) {
                    this.trail.push({ x: this.x, y: this.y, opacity: this.opacity });
                    if (this.trail.length > this.params.trailLength) this.trail.shift();
                    this.trail.forEach(t => t.opacity *= this.params.trailDecay);
                }

                // 噼啪 (Crackle)
                if (Math.random() < this.params.crackleChance) {
                    createCrackle(this.x, this.y, this.params.crackleParams);
                }
                
                return this.opacity > 0;
            }

            draw() {
                ctx.globalCompositeOperation = 'lighter'; // 使用滤色模式增加发光感
                
                if (this.params.hasTrail && this.trail.length > 0) {
                    ctx.beginPath();
                    ctx.strokeStyle = `hsla(${this.hue}, ${this.params.saturation}%, ${this.brightness}%, ${this.opacity * 0.3})`;
                    ctx.lineWidth = this.size;
                    ctx.moveTo(this.trail[0].x, this.trail[0].y);
                    for(let i = 1; i < this.trail.length; i++) {
                        ctx.lineTo(this.trail[i].x, this.trail[i].y);
                    }
                    ctx.stroke();
                }
                
                // 使用fillRect替代arc提高渲染效率，并产生像素风的细腻感
                ctx.fillStyle = `hsla(${this.hue}, ${this.params.saturation}%, ${this.brightness}%, ${this.opacity})`;
                const s = this.size * (0.5 + Math.random() * 0.5);
                ctx.fillRect(this.x - s/2, this.y - s/2, s, s);
                
                ctx.globalCompositeOperation = 'source-over';
            }
        }

        // --- 3. 核心功能 ---

        // 创建一次爆炸
        function createExplosion(x, y, effectId) {
            const params = getPreset(effectId);
            // 每一次爆炸都对规模进行二次随机微调
            const intensityScale = rand(0.7, 1.5);
            params.count = Math.floor(params.count * intensityScale);
            params.speedMin *= intensityScale;
            params.speedMax *= intensityScale;

            // 触发动态镜头震动
            shakeIntensity = Math.min(shakeIntensity + (params.count / 200), 5); // 大幅减小抖动增量与最大上限，使其更接近真实的空气震荡感
            
            // 如果预设没有强制指定颜色，且不是特定双色模式，可以在这里做微调，
            // 但为了保证20种效果区别明显，我们尽量尊重 getPreset 的配置。
            
            // 特殊处理：混沌模式
            if (params.chaos) {
                params.baseHue = rand(0, 360);
                params.hueVariance = 180;
                params.vortex = Math.random() > 0.5 ? 0.3 : 0;
                params.gravity = rand(-0.05, 0.2);
                params.friction = rand(0.9, 0.98);
            }

            // 创建粒子
            const shape = params.shape || 'sphere';
            for (let i = 0; i < params.count; i++) {
                if (params.specificColors) {
                    params.baseHue = params.specificColors[i % params.specificColors.length];
                    params.hueVariance = 0;
                }
                const p = new Particle(x, y, params);
                const angle = (i / params.count) * Math.PI * 2;
                const speed = rand(params.speedMin, params.speedMax);

                if (shape === 'heart') {
                    const t = angle;
                    const tx = 16 * Math.pow(Math.sin(t), 3);
                    const ty = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                    p.vx = tx * (speed / 15); p.vy = ty * (speed / 15);
                } else if (shape === 'ring') {
                    p.vx = Math.cos(angle) * params.speedMax;
                    p.vy = Math.sin(angle) * params.speedMax;
                }
                particles.push(p);
            }
        }
        
        // 创建噼啪 (Crackle) 效果
        function createCrackle(x, y, crackleParams) {
             // 噼啪效果通常是明亮的白色或金色
            const crackleBaseParams = {
                baseHue: rand(0, 360), 
                hueVariance: 20,
                saturation: rand(30, 60),
                brightnessMin: 60,
                brightnessMax: 85,
                fadeMin: 0.05,
                fadeMax: 0.1,
                speedMin: crackleParams.speed,
                speedMax: crackleParams.speed,
                gravity: rand(0.01, 0.03), 
                friction: 0.95,
                size: crackleParams.size,
                lifespan: crackleParams.lifespan,
                hasTrail: false,
                flicker: true,
                crackleChance: 0
            };
            
            for (let i = 0; i < crackleParams.count; i++) {
                particles.push(new Particle(x, y, crackleBaseParams));
            }
        }

        // 设置画布大小 (响应式)
        function setCanvasSize() {
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
        }

        // 游戏循环
        function gameLoop() {
            // 环境风场动态更新
            wind += (windTarget - wind) * 0.005;
            if (Math.random() < 0.01) windTarget = rand(-0.06, 0.06);

            // 增加清除力度以减少残影带来的性能开销
            ctx.save();
            if (shakeIntensity > 0) {
                // 随机位移模拟相机抖动
                ctx.translate((Math.random() - 0.5) * shakeIntensity, (Math.random() - 0.5) * shakeIntensity);
                shakeIntensity *= 0.85; // 加快衰减速度，让震动感变得短促且有力，不再产生晕眩感
                if (shakeIntensity < 0.1) shakeIntensity = 0;
            }

            ctx.fillStyle = 'rgba(0, 0, 0, 0.07)'; // 显著降低擦除频率，增强长尾迹的视觉残留效果
            // 扩大填充区域防止抖动时边缘露白
            ctx.fillRect(-50, -50, canvasWidth + 100, canvasHeight + 100);

            // 1. 移除星星的更新和绘制

            // 2. 移除火箭处理逻辑 (已改为直接触发爆炸)
            
            // 3. 更新和绘制粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                if (!particles[i].update()) {
                    particles.splice(i, 1);
                } else {
                    particles[i].draw();
                }
            }

            // 4. 绘制水面倒影 (垂直翻转效果)
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.setTransform(1, 0, 0, -0.3, 0, canvasHeight * 1.3);
            ctx.globalAlpha = 0.2;
            ctx.filter = 'blur(4px)';
            ctx.drawImage(canvas, 0, 0);
            ctx.restore();

            ctx.restore();

            // 5. 请求下一帧
            requestAnimationFrame(gameLoop);
        }

        // --- 4. 事件监听 ---
        
        // 窗口大小改变
        window.addEventListener('resize', setCanvasSize);
        
        function handleInteractionStart(e) {
            e.preventDefault();
            const now = Date.now();
            if (now - lastLaunchTime < 300) return;
            
            lastLaunchTime = now;
            mouse.down = true;
            let x, y;
            if (e.touches) {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            createExplosion(x, y, currentEffect);
        }

        function handleInteractionMove(e) {
            // 禁用滑动发射以防止绕过冷却时间，仅保留阻止默认滚动行为
            e.preventDefault();
        }
        
        function handleInteractionEnd(e) {
            e.preventDefault();
            mouse.down = false;
        }

        function startRandomMode() {
            stopRandomMode();
            const launchRandomFirework = () => {
                // 限制在居中长方形区域 (横向 20%-80%, 纵向 20%-70%)
                const x = rand(canvasWidth * 0.2, canvasWidth * 0.8);
                const y = rand(canvasHeight * 0.2, canvasHeight * 0.7);
                const effectId = Math.floor(rand(0, 20));
                createExplosion(x, y, effectId); // 直接炸开，去掉飞行过程
            };

            const intervalDuration = () => rand(300, 500); // 0.5 - 1s 随机间隔

            randomModeInterval = setTimeout(() => {
                launchRandomFirework();
                randomModeInterval = setTimeout(arguments.callee, intervalDuration()); // 递归调用以实现随机间隔
            }, intervalDuration());
        }

        function stopRandomMode() {
            if (randomModeInterval !== null) {
                clearTimeout(randomModeInterval);
                randomModeInterval = null;
            }
        }

        canvas.addEventListener('mousedown', handleInteractionStart);
        canvas.addEventListener('touchstart', handleInteractionStart, { passive: false });
        
        canvas.addEventListener('mousemove', handleInteractionMove);
        canvas.addEventListener('touchmove', handleInteractionMove, { passive: false });
        
        canvas.addEventListener('mouseup', handleInteractionEnd);
        canvas.addEventListener('touchend', handleInteractionEnd);

        let randomModeInterval = null;

        // 全屏切换与随机模式联动
        const trigger = document.getElementById('fullscreenTrigger');
        trigger.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                startRandomMode();
            } else {
                stopRandomMode();
            }
        });

        // --- 5. 游戏启动 ---
        setCanvasSize();
        gameLoop();

    </script>
</body>
</html>
